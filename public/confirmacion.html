<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Pedido | FoodExpress</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff5722'/><text y='68' x='50' text-anchor='middle' font-size='50' font-weight='bold' fill='white' font-family='sans-serif'>FX</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/styles.css">

  <script type="module" src="js/pages/confirmacion.js"></script>
</head>
<body class="min-h-screen bg-[#f8f9fa] font-sans text-gray-800">

  <header class="sticky top-0 z-50 border-b border-gray-100 bg-white">
    <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="index.html" class="flex items-center gap-2.5">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-[#ff5722] text-xs font-black text-white shadow-sm">
          FX
        </span>
        <span class="font-display text-lg font-extrabold tracking-tight text-gray-900">
          Food<span class="text-[#ff5722]">Express</span>
        </span>
      </a>

      <div class="flex items-center gap-4">
        <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-[#ff5722] transition">
          Volver al menú
        </a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:px-8">
    <div class="text-center">
      <div id="success-icon" class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-full bg-emerald-100 text-2xl text-emerald-600 shadow-sm">
        ✓
      </div>
      <h1 id="page-title" class="font-display text-2xl font-extrabold text-gray-900 sm:text-3xl">
        ¡Pedido confirmado!
      </h1>
      <p id="page-subtitle" class="mt-1 text-sm text-gray-500"></p>
    </div>

    <div id="order-loading" class="mt-8 rounded-2xl border border-gray-100 bg-white p-12 text-center shadow-sm">
      <div class="mx-auto mb-3 h-8 w-8 animate-spin rounded-full border-4 border-gray-200 border-t-[#ff5722]"></div>
      <p class="text-sm text-gray-500">Cargando información del pedido...</p>
    </div>

    <div id="order-lookup" hidden class="mt-8 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
      <form id="lookup-form" class="flex flex-col gap-3 sm:flex-row">
        <input id="lookup-id" type="text" placeholder="Ej. ORD-000001 o 1" class="input flex-1">
        <button type="submit" class="rounded-xl bg-[#ff5722] hover:bg-[#f4511e] px-6 py-2.5 text-sm font-bold text-white shadow-sm transition">
          Consultar
        </button>
      </form>
      <p id="error-lookup-id" class="field-error"></p>
    </div>

    <div id="order-error" hidden class="mt-8 rounded-2xl border border-rose-100 bg-rose-50 p-6 text-center">
      <p id="order-error-msg" class="text-sm text-rose-600 font-medium"></p>
    </div>

    <div id="order-content" hidden class="mt-8 space-y-6">
      <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-100 pb-4">
          <div>
            <span class="text-xs text-gray-400">Número de orden</span>
            <div class="flex items-center gap-2">
              <span id="order-number" class="font-display text-xl font-black text-gray-900"></span>
              <button type="button" id="btn-copy-order" class="text-xs text-[#ff5722] hover:underline">
                Copiar
              </button>
            </div>
            <p id="order-date" class="text-xs text-gray-400 mt-0.5"></p>
          </div>
          <span id="order-status-badge"></span>
        </div>

        <div class="mt-6">
          <div class="relative mb-6">
            <div class="absolute left-0 top-5 h-1 w-full bg-gray-100 -translate-y-1/2"></div>
            <div id="tracker-progress" class="absolute left-0 top-5 h-1 bg-[#ff5722] -translate-y-1/2 transition-all duration-500" style="width: 0%"></div>
            <ol id="order-tracker" class="relative flex justify-between"></ol>
          </div>
        </div>

        <div class="mt-6 rounded-xl bg-orange-50/70 border border-orange-100 p-4 text-center">
          <p class="text-xs font-semibold text-gray-500">Tiempo de entrega</p>
          <p id="eta-range" class="mt-1 font-display text-lg"></p>
        </div>
      </div>

      <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
        <h3 class="font-display text-base font-bold text-gray-900 mb-3">📍 Datos de Entrega</h3>
        <div class="grid gap-2 text-xs text-gray-600 sm:grid-cols-2">
          <div>
            <span class="font-semibold text-gray-700">Nombre:</span>
            <span id="delivery-nombre" class="ml-1 text-gray-900"></span>
          </div>
          <div>
            <span class="font-semibold text-gray-700">Teléfono:</span>
            <span id="delivery-telefono" class="ml-1 text-gray-900"></span>
          </div>
          <div class="sm:col-span-2">
            <span class="font-semibold text-gray-700">Dirección:</span>
            <span id="delivery-direccion" class="ml-1 text-gray-900"></span>
          </div>
        </div>
      </div>

      <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
        <h3 class="font-display text-base font-bold text-gray-900 mb-3">Resumen de Productos</h3>
        <ul id="order-items"></ul>

        <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-4 font-bold text-gray-900">
          <span>Total</span>
          <span id="order-total" class="font-display text-2xl text-[#ff5722]"></span>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-gray-400">
        <span id="last-updated"></span>
        <button type="button" id="btn-refresh-order" class="font-semibold text-[#ff5722] hover:underline">
          Actualizar estado ↻
        </button>
      </div>
    </div>
  </main>

  <footer class="mt-12 border-t border-gray-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-6 text-xs text-gray-500 sm:px-6 lg:px-8">
      <p>© <span data-year></span> FoodExpress · Proyecto Programación II</p>
    </div>
  </footer>
</body>
</html>
